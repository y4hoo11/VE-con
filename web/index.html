<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VE-com - ログイン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="login-screen">
    <form data-auth="form" class="login-card">
      <div class="stripe stripe--top"></div>
      <div class="stripe stripe--bottom-1"></div>
      <div class="stripe stripe--bottom-2"></div>

      <h1 class="logo">
        <span class="logo-accent">VE</span><span class="logo-rest">-com</span>
      </h1>

      <div class="fields">
        <label class="field">
          <span class="field-label">アカウント</span>
          <span class="bracket">[</span>
          <input type="text" data-auth="username" class="field-input" placeholder="入力するとこ" autocomplete="username" required>
          <span class="bracket">]</span>
        </label>

        <label class="field">
          <span class="field-label">パスワード</span>
          <span class="bracket">[</span>
          <input type="password" data-auth="password" class="field-input" placeholder="入力するとこ" autocomplete="current-password" required>
          <span class="bracket">]</span>
        </label>
      </div>

      <p data-auth="error" class="error-message" hidden></p>

      <button type="submit" data-auth="submit" class="login-button">ログイン</button>
    </form>
  </section>

  <script src="auth-config.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
