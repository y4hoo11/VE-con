<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ROS2 Map Web Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/easeljs@1.0.2/lib/easeljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.5/lib/eventemitter2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ros2d@0.9.0/build/ros2d.min.js"></script>
</head>
<body onload="init()">
  <h1>ROS2 Demo Map Viewer</h1>
  <div id="map" style="background-color: #ccc; width: 400px; height: 400px;"></div>
  <script>
    function init() {
      // WebSocketサーバーへ接続
      var ros = new ROSLIB.Ros({ url : 'ws://' + window.location.hostname + ':9090' });

      ros.on('connection', function() {
        console.log('Connected to websocket server.');
      });

      ros.on('error', function(error) {
        console.log('Error connecting to websocket server: ', error);
      });

      // キャンバスの作成
      var viewer = new ROS2D.Viewer({
        divID : 'map',
        width : 400,
        height : 400
      });

      // 地図クライアントの作成（/mapトピックの受信）
      var gridClient = new ROS2D.OccupancyGridClient({
        ros : ros,
        topic : '/map',
        rootObject : viewer.scene,
        continuous: true
      });

      gridClient.on('change', function() {
        // 地図のサイズに合わせて視点を自動調整
        viewer.scaleToDimensions(gridClient.currentGrid.width, gridClient.currentGrid.height);
        viewer.shift(gridClient.currentGrid.pose.position.x, gridClient.currentGrid.pose.position.y);
      });
    }
  </script>
</body>
</html>
